<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LingoReader｜互動式英文閱讀器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">L</div>
        <div>
          <strong>LingoReader</strong>
          <span>把任何英文文章變成你的互動教材</span>
        </div>
      </div>
      <div class="top-actions">
        <span id="aiStatus" class="status-pill">檢查 AI…</span>
        <button class="ghost-btn" id="openVocabBtn">單字本 <b id="vocabCount">0</b></button>
      </div>
    </header>

    <section class="import-card">
      <div class="import-heading">
        <div>
          <span class="eyebrow">READ · CLICK · LEARN</span>
          <h1>貼上文章網址，開始拆解英文。</h1>
        </div>
        <div class="settings-row">
          <label>程度
            <select id="levelSelect">
              <option>A1</option><option selected>A2</option><option>B1</option>
              <option>B2</option><option>C1</option>
            </select>
          </label>
          <label>翻譯
            <select id="languageSelect">
              <option selected>繁體中文</option><option>日文</option><option>英文</option>
            </select>
          </label>
        </div>
      </div>
      <div class="url-row">
        <span class="link-icon">↗</span>
        <input id="urlInput" type="url" placeholder="https://example.com/an-english-article" />
        <button id="loadBtn" class="primary-btn">生成互動文章</button>
      </div>
      <div class="import-footer">
        <button id="pasteModeBtn" class="text-btn">網站抓不到？改成貼上文章文字</button>
        <span>部分付費牆或登入網站無法自動讀取</span>
      </div>
      <div id="pastePanel" class="paste-panel hidden">
        <input id="manualTitle" placeholder="文章標題（可不填）" />
        <textarea id="manualText" rows="7" placeholder="把英文文章貼在這裡…"></textarea>
        <button id="useTextBtn" class="secondary-btn">使用這篇文字</button>
      </div>
    </section>

    <main class="workspace">
      <section class="reader-panel">
        <div id="emptyState" class="empty-state">
          <div class="empty-illustration">
            <span>word</span><span>phrase</span><span>grammar</span>
            <div>Aa</div>
          </div>
          <h2>你的文章會出現在這裡</h2>
          <p>點單字查字典，點句子看翻譯、慣用語與文法。</p>
          <button id="demoBtn" class="secondary-btn">先看示範文章</button>
        </div>
        <article id="articleView" class="article-view hidden">
          <div class="article-meta">
            <span id="sourceHost"></span>
            <span id="articleDate"></span>
          </div>
          <h2 id="articleTitle"></h2>
          <p id="articleAuthor" class="author"></p>
          <div class="reader-help">
            <span><i class="dot word-dot"></i> 點單字查意思</span>
            <span><i class="dot sentence-dot"></i> 點空白處選整句</span>
          </div>
          <div id="articleBody" class="article-body"></div>
        </article>
      </section>

      <aside class="study-panel">
        <div class="study-tabs">
          <button class="tab active" data-tab="analysis">句子解析</button>
          <button class="tab" data-tab="dictionary">字典</button>
          <button class="tab" data-tab="vocabulary">單字本</button>
        </div>

        <div id="analysisTab" class="tab-content active">
          <div id="analysisEmpty" class="panel-empty">
            <div class="panel-icon">⌁</div>
            <h3>選擇一個句子</h3>
            <p>點文章中的句子，我會顯示翻譯、結構、文法與慣用語。</p>
          </div>
          <div id="analysisContent" class="hidden">
            <div class="selected-card">
              <div class="card-label">SELECTED SENTENCE</div>
              <p id="selectedSentence"></p>
              <button id="speakSentenceBtn" class="icon-btn" title="朗讀">▶</button>
            </div>
            <button id="analyzeBtn" class="primary-btn full">翻譯並解析這句</button>
            <div id="analysisLoading" class="loading hidden"><span></span>正在拆解句子…</div>
            <div id="analysisResult"></div>
          </div>
        </div>

        <div id="dictionaryTab" class="tab-content">
          <div id="dictionaryEmpty" class="panel-empty">
            <div class="panel-icon">Aa</div>
            <h3>點一個英文單字</h3>
            <p>查看發音、詞性、英文解釋與例句。</p>
          </div>
          <div id="dictionaryContent" class="hidden"></div>
        </div>

        <div id="vocabularyTab" class="tab-content">
          <div class="vocab-toolbar">
            <input id="vocabSearch" placeholder="搜尋收藏的單字" />
            <button id="exportBtn" class="ghost-btn small">匯出 CSV</button>
          </div>
          <div id="vocabList"></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
